server {
    listen 80;
    listen [::]:80;
    server_name www.jidehub.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jidehub.top;

    ssl_certificate /etc/letsencrypt/live/www.jidehub.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jidehub.top/privkey.pem;

    root /var/www/jidehub.top/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
